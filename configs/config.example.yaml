app:
  name: "server-monitor"
  env: "dev"
  dash_ip: "__APP_DASH_IP__"
  listen: "__APP_LISTEN__"
  grpc_port: ":9090"
  public_url: "__APP_PUBLIC_URL__" # Root URL; use an IP or ASCII DNS name (IDNA/punycode for internationalized domains).
  timezone: "Asia/Shanghai" # Must be a valid IANA timezone name. Invalid values stop startup.
  language: "__APP_LANGUAGE__"
  log_level: "info" # Log level: debug/info/warn/error. HTTP access logs are emitted only in debug mode or with --debug.
  log_format: "text" # Log format: text (human-readable) or json (structured). This only changes output formatting.
  node_offline_threshold: "__APP_NODE_OFFLINE_THRESHOLD__"
http:
  # Controls proxy trust for authentication and failed-auth rate limiting. An empty array trusts only RemoteAddr there.
  # Authenticated node observations still record the first valid X-Forwarded-For value; see docs/architecture.md.
  trusted_proxies: __HTTP_TRUSTED_PROXIES__ # For a local reverse proxy, common values are ["127.0.0.1/32", "::1/128"].
database:
  driver: "postgres"
  host: "127.0.0.1"
  port: 5432
  user: "__DB_USER__"
  password: "__DB_PASS__"
  name: "__DB_NAME__"
  sslmode: "disable"
  max_open_conns: 50 # 0 means no explicit open-connection limit.
  max_idle_conns: 10 # Must not exceed a positive max_open_conns.
  conn_max_lifetime: "1h" # 0 disables age-based connection expiry.
  # retention_days omitted means default 45 days.
  # traffic_retention_days is independent; omitted means max(retention_days, 45).
  # traffic_5m uses rolling retention and stays writable for rebuilds.
  __DB_RETENTION_DAYS_LINE__
redis:
  addr: "__REDIS_ADDR__"
  username: ""
  password: "__REDIS_PASSWORD__"
  db: 0
  pool_size: 50 # 0 uses the go-redis default and requires min_idle_conns: 0.
  min_idle_conns: 10 # Must not exceed a positive pool_size.
  dial_timeout: "5s"
  read_timeout: "1s"
  write_timeout: "1s"
auth:
  jwt_signing_key: "__JWT_SIGNING_KEY__" # At least 32 bytes with no surrounding whitespace; the installer generates 32 random alphanumeric bytes.
