name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.27.1-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version

      - name: Install Frontend Dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Go Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: go test ./...

      - name: Go Format Check
        shell: bash
        run: |
          unformatted="$(find . -type f -name '*.go' -not -path './vendor/*' -print0 | xargs -0 -r gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Go Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Frontend Lint
        run: cd web && bun run lint

      - name: Frontend Typecheck
        run: cd web && bun run typecheck

      - name: Frontend Format Check
        run: cd web && bun run format:check

      - name: Frontend Dependency Audit
        run: cd web && bun audit --audit-level=high

      - name: Package
        env:
          ITHILTIR_NODE_VERSION: ${{ vars.ITHILTIR_NODE_VERSION }}
        shell: bash
        run: |
          node_args=()
          if [[ -n "${ITHILTIR_NODE_VERSION:-}" ]]; then
            node_args=(--node-version "$ITHILTIR_NODE_VERSION")
          fi
          bash scripts/package.sh --version 0.0.0-ci.1 "${node_args[@]}" -o release -t linux/amd64 --tar-gz

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ithiltir-package-ci
          path: release/*.tar.gz
          if-no-files-found: error
